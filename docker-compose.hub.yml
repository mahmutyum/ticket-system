# GHCR'dan yayınlanan HAZIR imajlarla kurulum — kaynak klonlamaya gerek yok.
#
# Kullanım:
#   VERSION=1.3.2 docker compose -f docker-compose.hub.yml up -d
#   # opsiyonel profiller: --profile backup (otomatik yedekleme), --profile proxy
#   # (yerleşik nginx), --profile tools (pgadmin)
#
# Sürümler:
#   VERSION=1.3.2  → belirli sürüm (önerilen)
#   VERSION=1.3    → aynı minor içindeki en son patch (otomatik güncelleme)
#   (yok)          → :latest
#
# İmaj etiketleri: https://github.com/mahmutyum/ticket-system/pkgs/container/ticket-system-backend
# Docker Hub bilinçli olarak KULLANILMAZ — imajlar GitHub Container Registry'de
# yayınlanır (limitsiz, ücretsiz); Docker Hub roadmap'te süresiz ertelendi.
#
# Migration'lar backend container'ı başlarken otomatik uygulanır
# (`prisma migrate deploy`) — geri sarma desteklenmez; major sürümlerde
# docs/installation.md'deki upgrade notlarını okuyun.

services:
  backend:
    image: ghcr.io/mahmutyum/ticket-system-backend:${VERSION:-latest}
    # Başlatma komutu backend/Dockerfile CMD'sinde: prisma migrate deploy && node dist/server.js
    expose:
      - "4000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/mahmutyum/ticket-system-frontend:${VERSION:-latest}
    ports:
      - "${FRONTEND_PORT:-1111}:1111"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Alpine localhost'u önce ::1'e çözer; Vite dev server IPv4'e bağlıyken
      # uygulama erişilebilir olsa da healthcheck yanlış negatif veriyordu.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1111/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ticketdb}
      POSTGRES_USER: ${DB_USER:-ticket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticket} -d ${DB_NAME:-ticketdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  backup:
    image: ghcr.io/mahmutyum/ticket-system-backup:${VERSION:-latest}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # uploads SADECE OKUNUR — yedekleyen süreç veriyi asla değiştirmemeli.
      - uploads:/src/uploads:ro
      # .env anlık görüntü için (environment.snapshot) — okunur, tek dosya.
      - ./.env:/src/.env:ro
      - backups:/backups
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - backup

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # Healthcheck parolayı komut satırı yerine REDISCLI_AUTH env'ine yazar
    # (docker inspect'te parola görünmez); `$$` compose interpolasyonundan kaçar.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Yerleşik nginx ters proxy (Coolify/NPM arkasında DEĞİLSE).
  nginx:
    image: ghcr.io/mahmutyum/ticket-system-proxy:${VERSION:-latest}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - proxy

  pgadmin:
    # Major pin: `latest` yükseltmeler panel davranışını sessizce değiştirebiliyor.
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@company.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - tools

volumes:
  pgdata:
  redisdata:
  uploads:
  backups:

networks:
  app-network:
    driver: bridge
