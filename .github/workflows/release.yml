name: Release

# Sürüm hattı (v1.3.2): v* etiketi push edildiğinde çalışır.
#   1. ci.yml workflow_call ile çağrılır (public-repo/backend/frontend/migrations/docker)
#   2. 4 first-party imaj GHCR'a multi-arch (amd64+arm64) yayınlanır:
#        ghcr.io/mahmutyum/ticket-system-{backend,frontend,backup,proxy}
#      Etiketler: :X.Y.Z + :X.Y; kararlı semver etiketlerine :latest de eklenir
#      (pre-release etiketlerine — örn. v1.3.2-rc.1 — latest YAZILMAZ).
#   3. git-cliff ile üretilen notlarla GitHub Release oluşturulur.
# CHANGELOG.md etiketten ÖNCE elle güncellenir: scripts/release-changelog.sh v1.3.2
#
# Docker Hub bilinçli olarak kullanılmaz — GHCR limitsiz ve ücretsizdir;
# Docker Hub roadmap'te süresiz ertelenmiştir (bkz. docs/roadmap.md).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # GitHub Release
  packages: write   # GHCR imaj yayını

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI doğrulaması
    uses: ./.github/workflows/ci.yml

  publish:
    name: GHCR imajları
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - component: backup
            context: ./backup-service
            dockerfile: ./backup-service/Dockerfile
          - component: proxy
            context: ./nginx
            dockerfile: ./nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # arm64 derlemesi QEMU emülasyonuyla yapılır; public repolarda ücretsizdir.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # flavor latest=auto: kararlı semver etiketine :latest ekler,
      # pre-release etiketine eklemez.
      - name: Docker meta ( ${{ matrix.component }} )
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major.minor}}

      - name: İmajı derle ve yayınla ( ${{ matrix.component }} )
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # git-cliff tam commit geçmişini tarar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Release notları üret
        run: git cliff --latest --strip all > release-notes.md

      - name: Release oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pre-release etiketleri (vX.Y.Z-rc.1 gibi) otomatik prerelease kalır
          # ve "latest" sürümü etkilemez.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
